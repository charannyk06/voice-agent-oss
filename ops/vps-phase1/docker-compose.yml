services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice_agent}
      POSTGRES_USER: ${POSTGRES_USER:-voice_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  asterisk:
    build:
      context: ./asterisk
    restart: unless-stopped
    network_mode: host
    environment:
      ASTERISK_ARI_USERNAME: ${ASTERISK_ARI_USERNAME:-voice-agent}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:?}
      ASTERISK_ARI_APPLICATION: ${ASTERISK_ARI_APPLICATION:-voice-agent}
      ASTERISK_ARI_ALLOWED_ORIGINS: ${ASTERISK_ARI_ALLOWED_ORIGINS:-http://127.0.0.1:3012}
      ASTERISK_PJSIP_ENDPOINT: ${ASTERISK_PJSIP_ENDPOINT:-byoc-trunk}
      ASTERISK_INBOUND_CONTEXT: ${ASTERISK_INBOUND_CONTEXT:-voice-agent-inbound}
      ASTERISK_OUTBOUND_CONTEXT: ${ASTERISK_OUTBOUND_CONTEXT:-voice-agent-outbound}
      ASTERISK_SIP_DOMAIN: ${ASTERISK_SIP_DOMAIN:-}
      ASTERISK_RTP_START: ${ASTERISK_RTP_START:-10000}
      ASTERISK_RTP_END: ${ASTERISK_RTP_END:-10100}
    volumes:
      - asterisk-spool:/var/spool/asterisk
      - asterisk-log:/var/log/asterisk

volumes:
  postgres-data:
  asterisk-spool:
  asterisk-log:
